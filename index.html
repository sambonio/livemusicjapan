<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0245e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LiveMusicJP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>LiveMusicJapan 24/7</title>
</head>
<body>
<header>
  <div>
    <h1 data-i18n="title"></h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
  <select id="lang" aria-label="Language"></select>
</header>
<p id="offline" class="notice" hidden data-i18n="offline"></p>
<nav class="filters">
  <div class="chips" id="when"></div>
  <div class="row">
    <select id="city"></select>
    <select id="genre"></select>
    <label class="toggle"><input type="checkbox" id="friendly"> <span data-i18n="friendly"></span></label>
  </div>
</nav>
<main id="list"></main>
<button id="install" hidden data-i18n="install"></button>
<footer><span id="source"></span></footer>
<script src="app.js"></script>
</body>
</html>
