name: Snapshot venue schedule pages
# Manual helper: saves the raw HTML (and robots.txt) of venue schedule pages to the
# `snapshots` branch so importers can be written against them.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Space-separated name=url pairs"
        required: true
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - env:
          PAGES: ${{ inputs.pages }}
        run: |
          mkdir snap && cd snap
          UA="LiveMusicJapanBot/0.1 (+https://livemusicjapan.app/)"
          for pair in $PAGES; do
            name=${pair%%=*}; url=${pair#*=}
            curl -sSL -m 30 -A "$UA" -o "$name.html" -w "$name %{http_code} %{size_download} %{url_effective}\n" "$url" >> result.txt || echo "$name failed $url" >> result.txt
            curl -sSL -m 15 -A "$UA" -o "$name.robots.txt" "$(echo $url | cut -d/ -f1-3)/robots.txt" || true
            sleep 2
          done
          cat result.txt
      - name: Save to the snapshots branch
        run: |
          cd snap
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Venue page snapshots $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshots
