name: Domain check (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for d in livemusicjapan.app livemusicjapan.com livemusicjapan.jp livemusic.jp gigsjapan.app; do
            code=$(curl -s -o "$d.json" -w "%{http_code}" -L "https://rdap.org/domain/$d")
            echo "$d $code" >> result.txt
            whois "$d" 2>/dev/null | head -40 > "$d.whois" || true
          done
          cat result.txt
          git init -q -b domain-check && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm check && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" domain-check
